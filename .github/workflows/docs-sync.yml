name: Docs Sync

# Phase 2 of the documentation system: AI-assisted maintenance.
#
# Fires post-merge on src/** changes, classifies the merge diff, updates the
# affected capability docs to match, and opens a doc-only PR for human review.
# Deliberately diverges from Anthropic's PR-time "Documentation Sync" pattern
# (one invocation per code change, separated review surfaces, AI mistakes do
# not block code merge). See docs/reference/documentation-system.md, Phase 2.
#
# This workflow only EDITS docs/; it never touches src/. It is disjoint from
# docs.yml by paths filter, so the two cannot trigger each other in a loop.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: doc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge diff range is resolvable.
          fetch-depth: 0

      - name: Resolve diff range
        id: range
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          # First push to the branch reports an all-zero "before"; fall back
          # to the merge commit's first parent.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || echo "$AFTER")"
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          echo "after_short=$(git rev-parse --short "$AFTER")" >> "$GITHUB_OUTPUT"
          echo "Diff range: $BEFORE..$AFTER"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run docs-sync agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The diff range is passed through the environment; the prompt
          # instructs the agent to use these in its git commands. The agent's
          # Bash tool inherits this environment.
          BEFORE_SHA: ${{ steps.range.outputs.before }}
          AFTER_SHA: ${{ steps.range.outputs.after }}
          AFTER_SHORT: ${{ steps.range.outputs.after_short }}
        run: |
          set -eo pipefail
          # claude-code-action@v1 rejects the `push` event, so we drive the
          # CLI headlessly instead — it is event-agnostic. Tools are scoped to
          # exactly what the prompt needs (read/edit/write files, run git);
          # NOT --dangerously-skip-permissions. In headless mode any tool
          # outside this allowlist is auto-denied without an interactive
          # prompt, so the run never hangs and the agent cannot run arbitrary
          # shell. The prompt further constrains edits to docs/ and forbids
          # commit/push/gh.
          timeout 600 claude -p "$(cat .github/docs-sync-prompt.md)" \
            --model claude-sonnet-4-6 \
            --max-turns 40 \
            --allowedTools "Read" "Edit" "Write" "Grep" "Glob" "Bash(git:*)"

      - name: Detect doc changes
        id: detect
        run: |
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No doc changes produced; docs-sync exiting without a PR."
          fi

      - name: Open doc-sync PR
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="docs/sync-from-${{ steps.range.outputs.after_short }}"
          git config user.name "deptagent-docs-sync"
          git config user.email "docs-sync@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Stage docs/ only — the PR body file at the repo root and any other
          # stray files are intentionally excluded.
          git add docs/
          git commit -m "docs: sync from ${{ steps.range.outputs.after_short }}"
          git push -u origin "$BRANCH" --force-with-lease
          BODY_FILE=".doc-sync-pr-body.md"
          if [ ! -f "$BODY_FILE" ]; then
            echo "Automated documentation sync for ${{ steps.range.outputs.after_short }}." > "$BODY_FILE"
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: sync from ${{ steps.range.outputs.after_short }}" \
            --body-file "$BODY_FILE"
